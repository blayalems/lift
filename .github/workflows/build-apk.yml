name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install required Android SDK components
        run: |
          # GitHub-hosted runners ship the Android SDK at $ANDROID_SDK_ROOT.
          # Install the exact platform + build-tools the project needs.
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37" \
            "build-tools;37.0.0" \
            "platform-tools" 2>&1 | tail -5

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: android
        run: |
          # Tell AGP where the Android SDK lives (most reliable method on CI)
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             lift-android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lift-android-debug
          path: lift-android-debug.apk
          retention-days: 90

      # ── Rolling "latest" release ─────────────────────────────────────────────
      - name: Delete previous latest-apk release (if exists)
        run: gh release delete latest-apk --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous latest-apk tag (if exists)
        run: git push origin :refs/tags/latest-apk 2>/dev/null || true

      - name: Create latest-apk release
        run: |
          gh release create latest-apk lift-android-debug.apk \
            --title "Lift v2.0.0 — Android 17 Debug APK" \
            --notes "## Lift v2.0.0 — Android 17 Debug APK

          Built from commit \`${{ github.sha }}\`

          ### How to install
          1. On your Android phone go to **Settings → Apps → Special app access → Install unknown apps**
          2. Allow installs from your browser or file manager
          3. Download \`lift-android-debug.apk\` below and tap **Install**

          ### What's new in Lift v2.0.0
          - **Android 17 (API 37) ready**: Adaptive large-screen/foldable resizability, edge-to-edge system bars, and predictive back sheet handling
          - **Enhanced Live Updates**: Phase-aware ProgressStyle workout chips (active sets, rest countdown, rest-done emerald, complete gold) with motivational quote subtext and quick actions (−15 s / Skip rest / +15 s / Logged it / Finish)
          - **Material 3 Expressive Widgets**: Home screen and lock screen keyguard widgets synced with live streak, level, and anti-hiatus cues
          - **Offline AI Coach & Momentum Engine**: Zero-API local coaching, XP/quests, Streak Freeze Shields, Mystery Crates, and scheduled habit reminder nudges

          > Debug build — safe to sideload; not Play Store signed." \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
